<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLR Mobile — Coming Soon</title>
  <meta name="description" content="Bengaluru's home for mobile devs. Coming soon.">
  <meta property="og:title" content="BLR Mobile — Coming Soon">
  <meta property="og:description" content="Bengaluru's home for mobile devs.">
  <meta property="og:url" content="https://blrmobile.in">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff6b35'/><rect x='32' y='18' width='36' height='64' rx='8' fill='none' stroke='white' stroke-width='6'/><circle cx='50' cy='72' r='3.5' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d12;
      --fg: #f4f1ea;
      --muted: #9a97a3;
      --accent: #ff6b35;
      --line: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(600px 400px at 85% 10%, rgba(255,107,53,0.18), transparent 70%),
        radial-gradient(500px 400px at 10% 90%, rgba(255,210,63,0.10), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; margin-bottom: 48px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
    .logo-mark span { width: 12px; height: 20px; border: 2.5px solid #fff; border-radius: 4px; }
    h1 { font-size: clamp(2.6rem, 9vw, 5.6rem); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; max-width: 12ch; }
    h1 em { font-style: normal; color: var(--accent); }
    .soon {
      margin-top: 28px; display: inline-flex; align-items: center; gap: 10px;
      font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .btn {
      margin-top: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 16px 28px; border-radius: 12px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 500; font-size: 1.05rem;
      text-decoration: none; transition: transform .15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="logo"><div class="logo-mark"><span></span></div>BLR Mobile</div>
  <h1>Bengaluru's home for <em>mobile devs.</em></h1>
  <div class="soon"><span class="dot"></span>Coming soon</div>
  <a class="btn" href="https://tally.so/r/zxPkrg" target="_blank" rel="noopener">Join the community →</a>
</body>
</html>
